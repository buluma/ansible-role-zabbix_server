---
- become: true
  gather_facts: false
- name: Prepare
  hosts: all
  name: Prepare
  pre_tasks:
    - name: Find EXTERNALLY-MANAGED files
      ansible.builtin.find:
        paths: /usr/lib
        patterns: "EXTERNALLY-MANAGED"
        recurse: true
      register: externally_managed_files

    - name: Remove EXTERNALLY-MANAGED files
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ externally_managed_files.files }}"

  roles:
    - role: buluma.bootstrap
    - role: buluma.selinux
    - role: buluma.container_docs
    - mysql_databases:
        - collation: utf8_bin
          encoding: utf8
          name: zabbix
      mysql_users:
        - name: zabbix
          password: zabbix
          priv: zabbix.*:ALL
      role: buluma.mysql
    - role: buluma.ca_certificates
    - role: buluma.zabbix_repository
    - role: buluma.core_dependencies
