---
  - become: true
    gather_facts: false
    hosts: all
    name: Prepare
    roles:
      - role: buluma.bootstrap
      - role: buluma.selinux
      - role: buluma.container_docs
      - mysql_databases:
          - collation: utf8_bin
            encoding: utf8
            name: zabbix
        mysql_users:
          - name: zabbix
            password: zabbix
            priv: zabbix.*:ALL
        role: buluma.mysql
      - role: buluma.ca_certificates
      - role: buluma.zabbix_repository
      - role: buluma.core_dependencies
